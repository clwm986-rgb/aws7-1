spring.application.name=diary

# MySQL Datasource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${EC2_HOST:localhost}:3306/diary_service?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 32자 이상의 임의 문자열 설정
jwt.secret= your-super-secret-key-that-is-at-least-32-bytes-long
# 1시간 (밀리초)
jwt.expiration= 3600000 
# 파일 경로
file.path=${FILE_PATH:C:/Users/fastcampus/Documents/uploads/}
# 1개당 파일 크기
spring.servlet.multipart.max-file-size = 10MB
# 최대 파일 크기
spring.servlet.multipart.max-request-size = 30MB