<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>부트:게시글</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/auth.js"></script>
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<h1>게시글 상세</h1>
		
		<!-- 게시판, 제목, 내용, 첨부파일(지금은 생략), 작성자(로그인 기능 구현 후 제거) -->
		<div class="form-group mb-3">
			<label class="form-label">제목</label>
			<input type="text" class="form-control" readonly name="title">
		</div>
		<div class="form-group mb-3">
			<label class="form-label">작성자</label>
			<input type="text" class="form-control" readonly name="writer">
		</div>
		<div class="form-group mb-3">
			<label class="form-label">게시판</label>
			<input type="text" class="form-control" readonly name="boardId">
		</div>
		<div class="form-group mb-3">
			<label class="form-label">조회수</label>
			<input type="text" class="form-control" readonly name="view">
		</div>
		<div class="form-group mb-3">
			<label class="form-label">작성일</label>
			<input type="text" class="form-control" readonly name="createdAt">
		</div>
		<div class="mb-3 d-flex justify-content-center">
			<button class="btn btn-outline-success me-3">좋아요(<span class="up-count">0</span>)</button>
			<button class="btn btn-outline-success">싫어요(<span class="down-count">0</span>)</button>
		</div>
		<div class="form-group mb-3">
			<label class="form-label">내용</label>
			<textarea class="form-control" rows="10" readonly name="content"></textarea>
		</div>
			
		<button class="btn btn-outline-danger btn-delete">삭제</button>
		<button class="btn btn-outline-warning btn-update">수정</button>
	</div>
	
	<script>
		//수정 버튼 요소 선택
		const 수정버튼 = document.querySelector(".btn-update");
		//이벤트 등록 
		수정버튼.addEventListener("click", e=>{
			location.href = "/post/update.html?num="+postId;
		});
		
	</script>
	
	<script >
		//btn-del 클릭이벤트를 등록
		
		//요소 선택
		//const 요소명 = document.querySelector("선택자");
		const deleteBtn = document.querySelector(".btn-delete");
		
		//이벤트 등록
		deleteBtn.addEventListener("click", async e => {
			if(!confirm("게시글을 정말로 삭제하겠습니까?")){
				return;
			}
			try{
				//서버로 요청
				//url : /api/post/게시글번호
				//method : delete
				const response = await authFetch(`/api/post/${postId}`,{
					method : "DELETE"
				});
				if(!response.ok){
					console.log("서버와 연결이 원할하지 않습니다.");
					return;
				}	
				
				const result = await response.text();
				alert(result);
				location.href = "/post/list.html";
			}catch(e){
				console.error(e);
			}
		});
		
		
		
	</script>
	
	<script>
		//URL에 있는 게시글 번호 num을 가져옴
		//location.search : URL 중 ? 뒷부분을 가져오는 코드
		const urlParams = new URLSearchParams(location.search);
		const postId = urlParams.get("num");
		
		//서버에 게시글을 요청해서 콘솔에 출력
		//url : /api/post/게시글번호
		//method : get
		getPost(postId);
		
		async function getPost(postId){
			//게시글 번호가 없으면
			if(!postId){
				alert("정상적이지 않은 접근입니다.");
				location.href="/post/list.html";
				return;
			}
			try{
				const response = await fetch(`/api/post/${postId}`);
				
				/* if(!response.ok){
					console.log("상태 OK 아님");
					return;
				} */
				
				const result = await response.json();
				
				if(result.isDeleted == "Y"){
					alert("삭제된 게시글입니다.");
					location.href="/post/list.html";
					return;
				}
				
				document.querySelector("[name=title]").value = result.title;
				document.querySelector("[name=writer]").value = result.memberId;
				document.querySelector("[name=boardId]").value = result.boardId;
				document.querySelector("[name=view]").value = result.viewCount;
				document.querySelector("[name=createdAt]").value = result.createdAt;
				document.querySelector("[name=content]").value = result.content;
				document.querySelector(".up-count").textContent = result.upCount;
				document.querySelector(".down-count").textContent = result.donwCount;
			}catch(e){
				console.error(e);
			}
		}
		
	</script>
</body>
</html>
