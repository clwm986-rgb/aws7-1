<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>부트:게시글</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/layout.js"></script>
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<h1>게시글 상세</h1>
		
		<!-- 게시판, 제목, 내용, 첨부파일(지금은 생략), 작성자(로그인 기능 구현 후 제거) -->
		<div class="form-group mb-3">
			<label class="form-label">제목</label>
			<input type="text" class="form-control" readonly>
		</div>
		<div class="form-group mb-3">
			<label class="form-label">작성자</label>
			<input type="text" class="form-control" readonly>
		</div>
		<div class="form-group mb-3">
			<label class="form-label">게시판</label>
			<input type="text" class="form-control" readonly>
		</div>
		<div class="form-group mb-3">
			<label class="form-label">조회수</label>
			<input type="text" class="form-control" readonly>
		</div>
		<div class="form-group mb-3">
			<label class="form-label">작성일</label>
			<input type="text" class="form-control" readonly>
		</div>
		<div class="mb-3 d-flex justify-content-center">
			<button class="btn btn-outline-success me-3">좋아요(0)</button>
			<button class="btn btn-outline-success">싫어요(0)</button>
		</div>
		<div class="form-group mb-3">
			<label class="form-label">내용</label>
			<textarea class="form-control" rows="10" readonly></textarea>
		</div>
			
		
	</div>
	
	<script>
		//URL에 있는 게시글 번호 num을 가져옴
		//location.search : URL 중 ? 뒷부분을 가져오는 코드
		const urlParams = new URLSearchParams(location.search);
		const postId = urlParams.get("num");
		
		//서버에 게시글을 요청해서 콘솔에 출력
		//url : /api/post/게시글번호
		//method : get
		getPost(postId);
		
		async function getPost(postId){
			try{
				const response = await fetch(`/api/post/${postId}`);
				
				/* if(!response.ok){
					console.log("상태 OK 아님");
					return;
				} */
				
				const result = await response.json();
				console.log(result);
			}catch(e){
				console.error(e);
			}
		}
		
	</script>
</body>
</html>
