<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>부트:게시글</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/auth.js"></script>
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<h1>게시글 등록</h1>
		<form id="insertForm">
			<!-- 게시판, 제목, 내용, 첨부파일(지금은 생략), 작성자(로그인 기능 구현 후 제거) -->
			<div class="form-group mb-3">
				<input type="text" class="form-control" name="title" placeholder="제목">
			</div>
			<div class="form-group mb-3">
				<select class="form-control board-list" name="boardId">
					<option value="4">공지</option>
				</select>
			</div>
			<div class="form-group mb-3">
				<textarea class="form-control" rows="10" name="content" placeholder="작성자"></textarea>
			</div>
			<button class="btn btn-outline-success col-12">게시글 등록</button>
		</form>
	</div>
	
	<!-- 게시판 목록 가져와서 화면에 출력  -->
	<script>
	getBoardList();
	async function getBoardList(){
		//서버에 게시판리스트를 요청해서 콘솔에 게시판 목록을 출력
		//URL : /api/post/board
		//method : GET
		try{
			const response = await fetch("/api/post/board");
			if(!response.ok){
				console.log("서버와 연결이 원할하지 않습니다.");
				return;
			}
			const result = await response.json();
			let str = '';
			
			result.forEach(b=>{
				str += `
					<option value="${b.id}">${b.name}</option>
				`
			});
			const boardListEl = document.querySelector(".board-list");
			boardListEl.innerHTML = str;
			
		}catch(e){
			console.error(e);
		}
	}
	</script>
	
	<script>
		//form태그에 submit 이벤트를 등록.
		//게시글 등록 버튼을 클릭하면 alert(1)이 띄도록
		const formEl = document.querySelector("#insertForm");
		formEl.addEventListener("submit", async e=>{
			e.preventDefault();
			
			//form태그 안에 있는 입력 태그들 값들을 가져와서 객체로 만듬
			const formData = new FormData(formEl);
			const data = Object.fromEntries(formData.entries());
			//data를 이용하여 서버에 전송
			//URL : /api/post
			//method : POST
			try{
				const response = await authFetch("/api/post", {
					method : "POST",
					headers : {
						"Content-Type" : "application/json"
					}, 
					body : JSON.stringify(data)
				}); 
				
				if(!response.ok){
					console.log("정상 종료 아님");
					return;
				}
				const result = await response.json();
				alert(result.msg);
				location.href ="/post/detail.html?num="+result.postId;
			}catch(e){
				console.log("예외처리 : ", e);
			}
		});
	</script>
</body>
</html>
