<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>부트:게시글</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/layout.js"></script>
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<h1>게시글 목록</h1>
		<table class="table table-hover">
		  <thead>
		    <tr>
		      <th>번호</th>
		      <th>제목</th>
		      <th>작성자</th>
		      <th>작성일</th>
		      <th>추천/비추천</th>
		    </tr>
		  </thead>
		  <tbody>
		    <tr>
		      <td>1</td>
		      <td><a href="/post/detail.html?num=1">공지사항입니다.</a></td>
		      <td>asd</td>
		      <td>2026-08-20</td>
		      <td>0/0</td>
		    </tr>
		  </tbody>
		</table>
		<a href="/post/insert.html" class="btn btn-outline-success" >글쓰기</a>
	</div>
	
	<script>
		//게시글 목록을 가져와서 콘솔에 출력하도록 작업
		getPostList();
		
		async function getPostList(){
			// /api/post
			// get
			try{
				const response = await fetch("/api/post");
				
				if(!response.ok){
					console.log("상태 OK 아님");
					return;
				}
				
				const result = await response.json();
				
				let listHtml = '';
				
				//등록된 게시글이 없는 경우 화면 처리
				if(result.length == 0){
					listHtml = '<tr><td colspan="5" class="text-center">등록된 게시글이 없습니다.</td></tr>';
					const tbodyEl = document.querySelector(".table tbody");
					tbodyEl.innerHTML = listHtml;
					return;
				}
				//반복문으로 게시글들을 html코드로 변환
				result.forEach(post=>{
					listHtml += `
						<tr>
					      <td>${post.id}</td>
					      <td><a href="/post/detail.html?num=${post.id}">${post.title}</a></td>
					      <td>${post.memberId}</td>
					      <td>${post.createdAt.slice(0,10)}</td>
					      <td>${post.upCount}/${post.downCount}</td>
					    </tr>
					`;
				});
				
				const tbodyEl = document.querySelector(".table tbody");
				tbodyEl.innerHTML = listHtml;
			}catch(e){
				console.error(e);
			}
		}
	</script>
</body>
</html>
