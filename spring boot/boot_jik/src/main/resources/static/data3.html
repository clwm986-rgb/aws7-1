<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>데이터 전송 연습 페이지</h1>
	<a href="/">메인페이로 이동</a>
	<pre>
		데이터 받는 방법2
		- 서버에서 보낸 데이터가 문자열이 아는 경우 
		- 객체
		- 리스트 
	</pre>
	
	<script type="text/javascript">
	
	async function getArticles1(url){
		try{
			//데이터 전송
			const response = await fetch(url);
			
			//정상응답이 아님 처리 
			if(!response.ok){
				throw new Error("서버 응답 에러 : " + response.status);
			}
			
			//정상응답 처리
			const result = await response.json();
			console.log(result);
			
		}catch(e){
			console.error("예외 발생 : \n" + e);
		}
	}
	
	getArticles1("/article/list1");
	getArticles1("/article/list2");
	getArticles1("/article/list3");
	</script>
</body>
</html>
