<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>스프링 부트 시작</h1>
	
	<button id="btn1">서버에서 문자열 받아오기</button>
	<button id="btn2">서버에서 Hello 문자열 받아오기</button>
	
	<hr>
	
	<!-- 
	input태그와 버튼태그를 추가하여 input태그에 숫자를 입력한 후 버튼을 누르면
	서버에 /page/숫자로 전송하여 결과를 받아오는 코드를 작성하세요. 
	 -->
	 
	<input type="number" id="input3" value="1">
	<button id=btn3>클릭</button>
	
	<script>
		//요소 선택 
		//const 요소명 = document.querySelector('선택자');
		const btn3 = document.querySelector('#btn3');
		
		const input3 = document.querySelector('#input3');
		
		//요소에 이벤트를 등록
		//요소.addEventListener('이벤트명', 함수);
		btn3.addEventListener('click', function(e){
			
			//input태그에 입력한 값을 가져옴 
			//요소.표준속성 : 요소의 표준속성값을 가져오거나 변경할 때 사용 
			let page = input3.value;
			sendPage(page);
		});
	
	</script>
	
	<script>
		const btn1 = document.querySelector("#btn1");
		
		btn1.addEventListener("click", e=>{
			/*
			비동기
			- 앞 작업이 다 안끝나도 뒤 작업을 실행하는 방식
			- 왜? 동시에 여러개 진행해서 화면 구성을 빠르게 끝내려고 
			
			*/
			connectMain();
			console.log("메인 요청 후");
		});
				
		//async : 함수를 비동기 함수로 만들겠다
		async function connectMain(){
			//fetch : 비동기 통신으로 데이터를 전송해서 받아오는 함수
			//await : 비동기 통신인 fetch의 결과를 기다렸다 받아오면 다음으로 실행하게 만들어줌 
			const response = await fetch('/');
			
			if(!response.ok){
				return ;
			}
			
			const result = await response.text();
			
			console.log("메인 요청 완료 : ", result);
		}
	</script>

	<script>
		//btn2를 클릭했을 때 서버에서 보낸 Hello를 받아와서 alert으로 띄우는 코드를 작성
		//url : /hello
		const btn2 = document.querySelector('#btn2');
		btn2.addEventListener("click", (e)=>{
			getHello();
		});
		
		async function getHello(){
			try{
				const response = await fetch('/hello');
				
				if(!response.ok){
					console.log('연결 실패');
					return;
				}
				
				const result = await response.text();
				alert(result);
			}catch(e){
				console.error('예외 발생', e);
			}
		}
		
	</script>

	<script>
		//화면에서 서버로 데이터 보내기1
		//url 경로에 데이터 실어 보내기 
		let page = 2;
		
		sendPage(page);
		
		async function sendPage(page){
			try{
				const response = await fetch(`/page/${page}`);
				
				if(!response.ok){
					console.log('연결 실패');
					return;
				}
				
				const result = await response.text();
				console.log(result);
			}catch(e){
				console.error('예외 발생', e);
			}
		}
		
		
	</script>

	<script>
		recieveObject();
		
		//서버에서 문자열이 아닌 개체나 배열을 보낼 때 
		async function recieveObject(){
			try{
				const response = await fetch('/recieve/object');
				
				if(!response.ok){
					console.log('연결 실패');
					return;
				}
				
				const result = await response.json();
				console.log(result);
			}catch(e){
				console.error('예외 발생', e);
			}
		}
	</script>
</body>
</html>
