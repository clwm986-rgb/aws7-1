<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>회원 가입</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/layout.js"></script>
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<h1>회원 가입</h1>
		
		<form id="form">
			<div class="form-group mb-3">
				<input class="form-control" name="id" type="text" placeholder="아이디를 입력하세요.">		
			</div>
			<div class="form-group mb-3">
				<input class="form-control" name="pw" type="password" placeholder="비번을 입력하세요.">
			</div>
			<div class="form-group mb-3">
				<input class="form-control" name="pw2" type="password" placeholder="비번확인을 입력하세요.">
			</div>
			<div class="form-group mb-3">
				<input class="form-control" name="email" type="email" placeholder="이메일을 입력하세요.">
			</div>
			<button class="btn btn-outline-success col-12">회원가입</button>
		</form>	
	</div>
	
	<script type="text/javascript">
		
	//form요소를 submit했을 때 아이디, 비번, 비번확인, 이메일을 가져와서 아이디, 비번, 이메이을 서버에 전송
	const formEl = document.querySelector("#form");
	const idEl = document.querySelector("[name=id]");
	const pwEl = document.querySelector("[name=pw]");
	const pw2El = document.querySelector("[name=pw2]");
	const emailEl = document.querySelector("[name=email]");
	
	formEl.addEventListener("submit", e=>{
		e.preventDefault();
		const id = idEl.value;
		const pw = pwEl.value;
		const pw2 = pw2El.value;
		const email = emailEl.value;
		
		const queryString = `id=${id}&pw=${pw}&email=${email}`;
		
		//sendData(queryString);
		
		let user = {
			id, //id : id,//왼쪽은 id라는 속성명, 오른족은 id변수
			pw, //pw : pw,
			email //email :email
		}
		
		//console.log(user);
		//FormData 객체를 이용하여 form태그 안에 있는 입력 태그들의 값들을 객체로 변환
		const formData = new FormData(formEl);
		const data = Object.fromEntries(formData.entries());
		//console.log(data);
		sendDataPost(data);
		
	});
	//get방식으로 회원 정보를 전송하는 함수(실제로 이러면 안됨)
	async function sendData(queryString){
		try{
			const response = await fetch("/user/signup?"+queryString);
			
			if(!response.ok){
				throw Error("회원 가입 실패")
			}
			
			const result = await response.text();
			alert(result);
			
		}catch(e){
			console.error("에러 발생 : ", e)
			alert(e);
		}
	}
	
	//회원 정보를 post 방식으로 전송
	async function sendDataPost(data){
		
		try{
			const response = await fetch("/user/signup", {
				method : "post",
				headers: {
					"Content-Type" : "application/json"//header에 실어 보낼 데이터 종류가 json
				},
				body : JSON.stringify(data) //보낼 데이터
			});
			
			
			const result = await response.text();
			alert(result);
			
		}catch(e){
			console.error("에러 발생 : ", e)
			alert(e);
		}
	}
	
	</script>
</body>
</html>
